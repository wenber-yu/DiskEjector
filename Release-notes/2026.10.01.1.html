<ul>
<li><strong>新增「推出结果通知」</strong>：每次推出完成后，系统会发一条通知告诉你结果 —— 成功是「已安全推出」，失败是「推出失败」并附原因说明（带提示音）。从此推出后即使切去做别的事，回来也知道盘有没有推成</li>
<li><strong>第一次使用会请求一次通知权限</strong>：在你第一次从应用里推出磁盘时，系统会弹一次「允许通知」的询问，允许后每次推出都能收到结果；不想收也可以在系统设置里关掉，应用一切功能照常</li>
<li><strong>不会刷屏</strong>：同一块盘的新结果通知会自动覆盖上一条，通知中心里永远只有最新的一次结果</li>
</ul>
