<ul>
<li><strong>修复 macOS 26 下的界面观感问题</strong>：在 macOS 26 上，主窗口侧栏恢复系统的「浮岛」效果，侧栏与设置项的悬停高亮恢复正常 —— 新版界面观感与系统完全一致</li>
<li><strong>修复点击「刷新」导致应用闪退</strong>：部分用户在 macOS 26 上点右上角刷新按钮会直接闪退，已修复</li>
<li><strong>修复刷新按钮变形、恢复转圈动画</strong>：点击刷新时按钮不再被挤压变形，刷新进行中会正常显示转圈动画</li>
<li><strong>菜单栏图标颜色恢复正常</strong>：菜单栏图标现在会跟随桌面壁纸的深浅自动变成黑色或白色，与系统其它图标表现一致（此前一旦在设置里改过强调色，图标就会固定颜色不再自适应）</li>
</ul>
