name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上的多次推送只保留最新一次运行，避免排队浪费 CI 时长。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 脚本大量输出中文，显式固定 UTF-8 locale，避免 runner 默认 locale 下输出乱码。
  LC_ALL: en_US.UTF-8

jobs:
  quality:
    name: 构建 · 格式 · 测试
    # runner 的 Xcode 选型必须与 Package.swift 的 tools version 对齐：
    # macos-15 镜像只提供 Xcode 16 系（Swift 6.1），而本包声明的是 6.3，
    # 会在预检门槛 1 直接报「package is using Swift tools version 6.3
    # but the installed version is 6.1」。macOS 26 镜像对应 Xcode 26（Swift 6.3.x）。
    # 注意 runner-images 的策略是「每个 macOS 版本只支持一个 Xcode 主版本」，
    # 所以升 tools version 时必须同步升 runner，否则 CI 必然红。
    runs-on: macos-26

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          # 同一镜像内会并存该主版本的多个 Xcode（26.0 / 26.1 / ...），默认未必指向最新，
          # 显式选最新那个，避免因默认版本偏低而误报 tools version 不满足。
          LATEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
            echo "已选用 Xcode：$LATEST"
          fi
          swift --version
          xcrun swift-format --version

      # 三道严格门槛：零警告构建（-Xswiftc -warnings-as-errors）、swift-format --strict、
      # 测试 + 覆盖率门槛。全部封装在 scripts/preflight.sh 里 —— 本地跑的是**同一个文件**
      # （`./run.sh check --with-tests`），因此不存在「本地判据与 CI 判据分叉」的可能。
      # 本仓库曾因两侧不一致，让 13 条 Swift 6 并发错误在本地一路绿灯的情况下潜伏三天。
      - name: 代码门槛（零警告构建 · 格式 · 测试覆盖率）
        run: ./scripts/preflight.sh --with-tests

      # 打包验证：确认 .app 能构建出来且签名步骤不报错。
      # 提前发现 Info.plist / 资源拷贝 / codesign 环节的问题，
      # 而不是等到准备上架时才发现打不出包。
      - name: 打包验证
        run: ./build_app.sh

      - name: 校验产物
        run: |
          APP="dist/DiskEjector.app"
          test -d "$APP" || { echo "::error::未生成 $APP"; exit 1; }
          echo "产物结构:"
          find "$APP" -maxdepth 4 \( -name "*.plist" -o -name "DiskEjectorApp" -o -name "*.icns" \) | sed 's/^/  /'
