<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单栏弹出面板</title>
    <style id="theme-vars">
:root {
  --disk-background: #ffffff;
  --disk-foreground: #0f172a;
  --disk-card: rgba(255, 255, 255, 0.72);
  --disk-card-foreground: #0f172a;
  --disk-popover: rgba(255, 255, 255, 0.86);
  --disk-popover-foreground: #0f172a;
  --disk-primary: #0a84ff;
  --disk-primary-foreground: #ffffff;
  --disk-muted: rgba(120, 129, 144, 0.14);
  --disk-muted-foreground: #6b7280;
  --disk-border: rgba(0, 0, 0, 0.08);
  --disk-input: rgba(0, 0, 0, 0.06);
  --disk-ring: #0a84ff;
  --disk-radius-sm: 6px;
  --disk-radius-md: 10px;
  --disk-radius-lg: 16px;
  --disk-success: #34c759;
  --disk-warning: #ff9f0a;
  --disk-error: #ff453a;
  --disk-info: #0a84ff;
  --disk-font-sans: Inter, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
  --disk-font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, monospace;
}

.dark {
  --disk-background: #0b0b0f;
  --disk-foreground: #f8fafc;
  --disk-card: rgba(28, 28, 36, 0.72);
  --disk-card-foreground: #f8fafc;
  --disk-popover: rgba(28, 28, 36, 0.86);
  --disk-popover-foreground: #f8fafc;
  --disk-primary: #409cff;
  --disk-primary-foreground: #ffffff;
  --disk-muted: rgba(255, 255, 255, 0.10);
  --disk-muted-foreground: #9ca3af;
  --disk-border: rgba(255, 255, 255, 0.10);
  --disk-input: rgba(255, 255, 255, 0.08);
  --disk-ring: #409cff;
}

@media (prefers-color-scheme: dark) {
  :root:not(.light) {
    --disk-background: #0b0b0f;
    --disk-foreground: #f8fafc;
    --disk-card: rgba(28, 28, 36, 0.72);
    --disk-card-foreground: #f8fafc;
    --disk-popover: rgba(28, 28, 36, 0.86);
    --disk-popover-foreground: #f8fafc;
    --disk-primary: #409cff;
    --disk-primary-foreground: #ffffff;
    --disk-muted: rgba(255, 255, 255, 0.10);
    --disk-muted-foreground: #9ca3af;
    --disk-border: rgba(255, 255, 255, 0.10);
    --disk-input: rgba(255, 255, 255, 0.08);
    --disk-ring: #409cff;
  }
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/Dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/Dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--disk-background);
    --color-foreground: var(--disk-foreground);
    --color-card: var(--disk-card);
    --color-card-foreground: var(--disk-card-foreground);
    --color-popover: var(--disk-popover);
    --color-popover-foreground: var(--disk-popover-foreground);
    --color-primary: var(--disk-primary);
    --color-primary-foreground: var(--disk-primary-foreground);
    --color-muted: var(--disk-muted);
    --color-muted-foreground: var(--disk-muted-foreground);
    --color-border: var(--disk-border);
    --color-input: var(--disk-input);
    --color-ring: var(--disk-ring);
    --radius-sm: var(--disk-radius-sm);
    --radius-md: var(--disk-radius-md);
    --radius-lg: var(--disk-radius-lg);
  }
  @layer base {
    body { background: var(--disk-background); color: var(--disk-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--disk-background); }
      .text-background { color: var(--disk-background); }
      .border-background { border-color: var(--disk-background); }
      .ring-background { --tw-ring-color: var(--disk-background); }
      .bg-foreground { background-color: var(--disk-foreground); }
      .text-foreground { color: var(--disk-foreground); }
      .border-foreground { border-color: var(--disk-foreground); }
      .ring-foreground { --tw-ring-color: var(--disk-foreground); }
      .bg-card { background-color: var(--disk-card); }
      .text-card { color: var(--disk-card); }
      .border-card { border-color: var(--disk-card); }
      .ring-card { --tw-ring-color: var(--disk-card); }
      .bg-card-foreground { background-color: var(--disk-card-foreground); }
      .text-card-foreground { color: var(--disk-card-foreground); }
      .border-card-foreground { border-color: var(--disk-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--disk-card-foreground); }
      .bg-popover { background-color: var(--disk-popover); }
      .text-popover { color: var(--disk-popover); }
      .border-popover { border-color: var(--disk-popover); }
      .ring-popover { --tw-ring-color: var(--disk-popover); }
      .bg-popover-foreground { background-color: var(--disk-popover-foreground); }
      .text-popover-foreground { color: var(--disk-popover-foreground); }
      .border-popover-foreground { border-color: var(--disk-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--disk-popover-foreground); }
      .bg-primary { background-color: var(--disk-primary); }
      .text-primary { color: var(--disk-primary); }
      .border-primary { border-color: var(--disk-primary); }
      .ring-primary { --tw-ring-color: var(--disk-primary); }
      .bg-primary-foreground { background-color: var(--disk-primary-foreground); }
      .text-primary-foreground { color: var(--disk-primary-foreground); }
      .border-primary-foreground { border-color: var(--disk-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--disk-primary-foreground); }
      .bg-muted { background-color: var(--disk-muted); }
      .text-muted { color: var(--disk-muted); }
      .border-muted { border-color: var(--disk-muted); }
      .ring-muted { --tw-ring-color: var(--disk-muted); }
      .bg-muted-foreground { background-color: var(--disk-muted-foreground); }
      .text-muted-foreground { color: var(--disk-muted-foreground); }
      .border-muted-foreground { border-color: var(--disk-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--disk-muted-foreground); }
      .bg-border { background-color: var(--disk-border); }
      .text-border { color: var(--disk-border); }
      .border-border { border-color: var(--disk-border); }
      .ring-border { --tw-ring-color: var(--disk-border); }
      .bg-input { background-color: var(--disk-input); }
      .text-input { color: var(--disk-input); }
      .border-input { border-color: var(--disk-input); }
      .ring-input { --tw-ring-color: var(--disk-input); }
      .bg-ring { background-color: var(--disk-ring); }
      .text-ring { color: var(--disk-ring); }
      .border-ring { border-color: var(--disk-ring); }
      .ring-ring { --tw-ring-color: var(--disk-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="disk-popup-shell">
        <style id="critical-layout">
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: 48px 16px;
                background: linear-gradient(135deg, #c7d2fe 0%, #e0e7ff 50%, #f3f4f6 100%);
                font-family: var(--disk-font-sans);
            }
            .disk-popup-shell {
                width: 360px;
                max-width: 100%;
            }
            .disk-popup-card {
                width: 360px;
                max-width: 100%;
                border-radius: var(--disk-radius-lg, 16px);
                background: var(--disk-popover, rgba(255,255,255,0.86));
                backdrop-filter: blur(20px) saturate(180%);
                -webkit-backdrop-filter: blur(20px) saturate(180%);
                border: 1px solid var(--disk-border, rgba(0,0,0,0.08));
                box-shadow:
                    0 20px 40px rgba(0,0,0,0.12),
                    0 0 0 1px rgba(255,255,255,0.5) inset;
                overflow: hidden;
            }
            .disk-popup-header {
                padding: 12px 16px 8px;
            }
            .disk-popup-title {
                margin: 0;
                font-size: 14px;
                font-weight: 500;
                line-height: 1.3;
                color: var(--disk-foreground, #0f172a);
            }
            .disk-list {
                list-style: none;
                margin: 0;
                padding: 4px 12px 8px;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .disk-row {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 10px;
                border-radius: var(--disk-radius-md, 10px);
                transition: background-color 0.15s ease;
            }
            .disk-row:hover {
                background-color: var(--disk-muted, rgba(120,129,144,0.14));
            }
            .disk-icon-wrap {
                flex: 0 0 auto;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: var(--disk-radius-md, 10px);
                background: rgba(10,132,255,0.10);
            }
            .disk-icon {
                width: 18px;
                height: 18px;
                color: var(--disk-primary, #0a84ff);
            }
            .disk-info {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .disk-name {
                margin: 0;
                font-size: 13px;
                font-weight: 500;
                line-height: 1.25;
                color: var(--disk-foreground, #0f172a);
            }
            .disk-meta {
                margin: 0;
                font-size: 11px;
                line-height: 1.25;
                color: var(--disk-muted-foreground, #6b7280);
            }
            .disk-eject-btn {
                flex: 0 0 auto;
                appearance: none;
                border: 1px solid var(--disk-primary, #0a84ff);
                background: transparent;
                color: var(--disk-primary, #0a84ff);
                font-size: 12px;
                font-weight: 500;
                line-height: 1;
                padding: 4px 10px;
                border-radius: var(--disk-radius-sm, 6px);
                cursor: pointer;
                transition: background-color 0.15s ease, color 0.15s ease;
            }
            .disk-eject-btn:hover {
                background: var(--disk-primary, #0a84ff);
                color: var(--disk-primary-foreground, #ffffff);
            }
            .disk-separator {
                height: 1px;
                margin: 6px 12px;
                background: var(--disk-border, rgba(0,0,0,0.08));
            }
            .disk-actions {
                display: flex;
                flex-direction: column;
                padding: 4px 12px 8px;
                gap: 2px;
            }
            .disk-action-row {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                text-align: left;
                appearance: none;
                border: none;
                background: transparent;
                padding: 7px 10px;
                border-radius: var(--disk-radius-md, 10px);
                color: var(--disk-foreground, #0f172a);
                cursor: pointer;
                transition: background-color 0.15s ease;
            }
            .disk-action-row:hover {
                background-color: var(--disk-muted, rgba(120,129,144,0.14));
            }
            .disk-action-icon {
                flex: 0 0 auto;
                width: 16px;
                height: 16px;
                color: var(--disk-muted-foreground, #6b7280);
            }
            .disk-action-label {
                font-size: 13px;
                font-weight: 400;
                line-height: 1.25;
            }
            .disk-action-danger .disk-action-icon,
            .disk-action-danger .disk-action-label {
                color: var(--disk-error, #ff453a);
            }
        </style>

        <section class="disk-popup-card">
            <header class="disk-popup-header">
                <h1 class="disk-popup-title">外置磁盘</h1>
            </header>

            <ul class="disk-list">
                <li class="disk-row">
                    <div class="disk-icon-wrap">
                        <i data-lucide="hard-drive" class="disk-icon"></i>
                    </div>
                    <div class="disk-info">
                        <p class="disk-name">Samsung T7</p>
                        <p class="disk-meta">1 TB · 已用 300 GB / 剩余 700 GB</p>
                    </div>
                    <button type="button" class="disk-eject-btn" data-dom-id="eject-disk-samsung">
                        推出
                    </button>
                </li>

                <li class="disk-row">
                    <div class="disk-icon-wrap">
                        <i data-lucide="hard-drive" class="disk-icon"></i>
                    </div>
                    <div class="disk-info">
                        <p class="disk-name">WD Blue</p>
                        <p class="disk-meta">500 GB · 已用 120 GB / 剩余 380 GB</p>
                    </div>
                    <button type="button" class="disk-eject-btn" data-dom-id="eject-disk-wd">
                        推出
                    </button>
                </li>
            </ul>

            <div class="disk-separator" role="separator"></div>

            <nav class="disk-actions">
                <button type="button" class="disk-action-row" data-dom-id="open-main-window">
                    <i data-lucide="app-window-mac" class="disk-action-icon"></i>
                    <span class="disk-action-label">打开主窗口</span>
                </button>
                <button type="button" class="disk-action-row">
                    <i data-lucide="refresh-cw" class="disk-action-icon"></i>
                    <span class="disk-action-label">刷新</span>
                </button>
                <button type="button" class="disk-action-row" data-dom-id="open-settings">
                    <i data-lucide="settings" class="disk-action-icon"></i>
                    <span class="disk-action-label">设置</span>
                </button>
                <div class="disk-separator" role="separator"></div>
                <button type="button" class="disk-action-row disk-action-danger">
                    <i data-lucide="log-out" class="disk-action-icon"></i>
                    <span class="disk-action-label">退出</span>
                </button>
            </nav>
        </section>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
